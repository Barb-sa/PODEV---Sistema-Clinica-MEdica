<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CB Clinical | Secretário - Cadastro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <!-- Exporte a logo do seu design e salve como logo-cb-clinical.svg -->
      <img class="sidebar__logo" src="logo_escura.png" alt="CB Clinical Ultrassonografia" />

      <nav class="nav" aria-label="Menu principal">
        <a class="nav__item" href="paciente.html">
          <svg viewBox="0 0 40 40" fill="currentColor" aria-hidden="true">
            <path d="M3 6h3v17h28v-4.5A5.5 5.5 0 0 0 28.5 13H15v10H12V10h16.5A8.5 8.5 0 0 1 37 18.5V34h-3v-8H6v8H3V6Z" />
            <circle cx="10" cy="17" r="3.2" />
          </svg>
          Paciente
        </a>
        <a class="nav__item nav__item--active" href="index.html" aria-current="page">
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" aria-hidden="true">
            <rect x="5" y="5" width="12" height="12" rx="1.5" />
            <rect x="23" y="5" width="12" height="20" rx="1.5" />
            <rect x="5" y="23" width="12" height="12" rx="1.5" />
            <rect x="23" y="31" width="12" height="4" rx="1.5" />
          </svg>
          Cadastro
        </a>
      </nav>

      <div class="sidebar__user">
        <p class="sidebar__name">Nome Secretario</p>
        <p class="sidebar__email">nome.secretario@gmail.com</p>
      </div>
    </aside>

    <main class="main">
      <header class="main__header">
        <h1 class="badge">Cadastro</h1>
      </header>

      <form class="form" id="cadastro-form" novalidate>
        <div class="form__grid">
          <div class="form__col">
            <div class="field">
              <label for="nome">Nome Completo</label>
              <input id="nome" name="nome" type="text" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="telefone">Telefone</label>
              <input id="telefone" name="telefone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(00) 00000-0000" maxlength="15" required />
            </div>
            <div class="field">
              <label for="cpf">CPF</label>
              <input id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required />
            </div>
          </div>

          <div class="form__col">
            <div class="field">
              <label for="nascimento">Data de Nascimento</label>
              <input id="nascimento" name="nascimento" type="date" required />
            </div>
            <div class="field">
              <label for="email">E-mail</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
          </div>
        </div>

        <button type="submit" class="form__submit">Enviar</button>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
