<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CB Clinical | Secretário - Cadastro</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" data-perfil="secretario" data-ativo="cadastro"></aside>

    <main class="main">
      <header class="main__header">
        <h1 class="badge">Cadastro</h1>
      </header>

      <form class="form" id="cadastro-form" novalidate>
        <div class="form__grid">
          <div class="form__col">
            <div class="field">
              <label for="nome">Nome Completo</label>
              <input id="nome" name="nome" type="text" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="telefone">Telefone</label>
              <input id="telefone" name="telefone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(00) 00000-0000" maxlength="15" required />
            </div>
            <div class="field">
              <label for="cpf">CPF</label>
              <input id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required />
            </div>
          </div>

          <div class="form__col">
            <div class="field">
              <label for="nascimento">Data de Nascimento</label>
              <input id="nascimento" name="nascimento" type="date" required />
            </div>
            <div class="field">
              <label for="email">E-mail</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
          </div>
        </div>

        <button type="submit" class="form__submit">Enviar</button>
      </form>
    </main>
  </div>

  <script type="module">
    import { montarSidebar } from "../js/sidebar.js";
    montarSidebar();
  </script>
  <script src="script.js"></script>
</body>
</html>
