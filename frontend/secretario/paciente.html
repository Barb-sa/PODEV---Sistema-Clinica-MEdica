<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CB Clinical | Secretário - Pacientes</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/secretario_paciente.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" data-perfil="secretario" data-ativo="paciente"></aside>

    <main class="main pacientes">
      <h1 class="sr-only" style="position:absolute;left:-9999px">Pacientes</h1>

      <form class="search" role="search" id="search-form">
        <input type="search" id="search" placeholder="Buscar paciente" aria-label="Buscar paciente" autocomplete="off" />
        <button type="button" class="icon-btn" id="sort-btn" aria-label="Ordenar: mais recentes primeiro" aria-pressed="false" title="Inverter ordem por data">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="10" x2="15" y2="10" /><circle cx="19" cy="10" r="3" /><line x1="23" y1="10" x2="28" y2="10" />
            <line x1="4" y1="22" x2="9" y2="22" /><circle cx="13" cy="22" r="3" /><line x1="17" y1="22" x2="28" y2="22" />
          </svg>
        </button>
        <button type="submit" class="icon-btn" aria-label="Buscar">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <circle cx="14" cy="14" r="9" /><line x1="21" y1="21" x2="28" y2="28" />
          </svg>
        </button>
      </form>

      <ul class="patient-list" id="patient-list"></ul>
    </main>
  </div>

<script type="module">
    import { montarSidebar } from "../js/sidebar.js";
    montarSidebar();
  </script>
  <script src="script.js"></script>
</body>
</body>
</html>
